<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finanzas JC</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#0f0f0f; --surface:#1a1a1a; --surface2:#242424; --border:#2e2e2e;
  --accent:#00d9a6; --accent-dim:rgba(0,217,166,.12);
  --text:#f0f0f0; --text-mid:#a0a0a0; --text-dim:#666;
  --red:#ff4d6d; --yellow:#ffd166; --blue:#74b9ff; --purple:#a29bfe;
  --radius:12px; --radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
.mono{font-family:'JetBrains Mono',monospace}
.app{max-width:920px;margin:0 auto;padding:24px 16px 60px}
.pos{color:var(--accent)} .neg{color:var(--red)} .warn{color:var(--yellow)} .dim{color:var(--text-dim)} .mid{color:var(--text-mid)}

/* Header */
.header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.header h1{font-size:22px;font-weight:700;letter-spacing:-.5px}
.header h1 span{color:var(--accent)}
.header p{color:var(--text-mid);font-size:12px;margin-top:3px}
.month-nav{display:flex;align-items:center;gap:10px}
.month-nav button{background:var(--surface2);border:1px solid var(--border);color:var(--text);width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:15px}
.month-nav button:hover{border-color:var(--accent);color:var(--accent)}
#mes-label{font-size:13px;font-weight:600;min-width:120px;text-align:center;color:var(--accent);font-family:'JetBrains Mono',monospace}

/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--surface);border-radius:var(--radius);padding:4px}
.tab{flex:1;padding:9px 0;text-align:center;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:600;color:var(--text-mid);border:none;background:none;font-family:inherit}
.tab.active{background:var(--surface2);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.panel{display:none}.panel.active{display:block}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-title{font-size:14px;font-weight:700}
.card-sub{font-size:11.5px;color:var(--text-mid);margin-top:3px;line-height:1.4}
.hero{background:linear-gradient(135deg,var(--accent-dim),transparent);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px}
.hero.bad{background:linear-gradient(135deg,rgba(255,77,109,.10),transparent);border-left-color:var(--red)}
.hero.mid{background:linear-gradient(135deg,rgba(255,209,102,.10),transparent);border-left-color:var(--yellow)}
.hero h2{font-size:19px;font-weight:700;letter-spacing:-.4px;line-height:1.35}
.hero p{font-size:12.5px;color:var(--text-mid);margin-top:6px;line-height:1.45}
.meta-track{height:8px;background:var(--surface2);border-radius:4px;margin-top:12px;position:relative;overflow:visible}
.meta-fill{height:100%;border-radius:4px;background:var(--accent)}
.meta-mark{position:absolute;top:-4px;width:2px;height:16px;background:var(--text)}
.meta-legend{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-dim);margin-top:5px}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--accent)}
.kpi-l{font-size:9.5px;font-weight:700;color:var(--text-dim);letter-spacing:.7px;text-transform:uppercase;margin-bottom:6px}
.kpi-v{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;line-height:1.2}
.kpi-s{font-size:10.5px;color:var(--text-mid);margin-top:4px;line-height:1.35}

/* Disponible */
.disp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.disp-cell{background:var(--surface2);border-radius:var(--radius-sm);padding:10px 12px}
.disp-cell .l{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.disp-cell .v{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;margin-top:4px}
.big-num{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700}

/* Sobres */
.grp-title{font-size:10.5px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.7px;margin:14px 0 4px}
.sobre{display:grid;grid-template-columns:170px 1fr 150px 86px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer}
.sobre:last-child{border-bottom:none}
.sobre:hover .s-name{color:var(--accent)}
.s-name{font-size:13px;font-weight:600}
.s-cats{font-size:10.5px;color:var(--text-dim);margin-top:2px}
.track{height:8px;background:var(--surface2);border-radius:4px;position:relative;overflow:visible}
.fill{height:100%;border-radius:4px;max-width:100%}
.fill.ok{background:var(--accent)} .fill.warn{background:var(--yellow)} .fill.over{background:var(--red)} .fill.ter{background:var(--purple)}
.pace{position:absolute;top:-4px;width:2px;height:16px;background:var(--text-mid);opacity:.8}
.s-val{font-family:'JetBrains Mono',monospace;font-size:12px;text-align:right;color:var(--text-mid)}
.s-val b{color:var(--text)}
.chip{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;text-align:center;white-space:nowrap}
.chip.ok{background:var(--accent-dim);color:var(--accent)} .chip.warn{background:rgba(255,209,102,.12);color:var(--yellow)}
.chip.over{background:rgba(255,77,109,.12);color:var(--red)} .chip.dim{background:var(--surface2);color:var(--text-mid)}
.chip.ter{background:rgba(162,155,254,.14);color:var(--purple)}
.s-edit{width:110px;padding:6px 8px;font-size:13px}
.tot-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:12px;margin-top:6px;border-top:1px solid var(--border);font-size:12.5px}
.note{font-size:11.5px;color:var(--text-mid);background:var(--surface2);border-radius:var(--radius-sm);padding:10px 12px;margin-top:10px;line-height:1.45}
.note.warn{color:var(--yellow);background:rgba(255,209,102,.08)}
.note.bad{color:var(--red);background:rgba(255,77,109,.08)}

/* Categorias */
.cat-row{display:grid;grid-template-columns:150px 1fr 100px 120px;gap:10px;align-items:center;padding:6px 0;font-size:12.5px}
.cat-bar{height:6px;border-radius:3px;background:var(--blue)}
.cat-amt{font-family:'JetBrains Mono',monospace;text-align:right;font-weight:600}
.cat-delta{font-family:'JetBrains Mono',monospace;font-size:11px;text-align:right}

/* Tablas */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:8px 10px;font-size:10.5px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 10px;font-size:12.5px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right}
td.num{font-family:'JetBrains Mono',monospace;text-align:right;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}
tr.sel td{background:rgba(0,217,166,.06)}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.dup{color:var(--yellow);font-size:11px;margin-left:4px}

/* Forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg{display:flex;flex-direction:column;gap:6px}.fg.full{grid-column:1/-1}
.fg label,.lbl{font-size:11px;font-weight:600;color:var(--text-mid);text-transform:uppercase;letter-spacing:.4px}
input,select{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:10px 12px;font-family:inherit;font-size:14px;outline:none;width:100%}
input:focus,select:focus{border-color:var(--accent)}
input[type=number]{font-family:'JetBrains Mono',monospace;font-weight:600}
.seg{display:flex;gap:8px}
.seg-btn{flex:1;padding:10px 8px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text-mid);cursor:pointer;font-size:12.5px;font-weight:600;text-align:center;font-family:inherit}
.seg-btn.active{border-color:var(--accent);background:var(--accent-dim);color:var(--accent)}
.seg-btn.active.ing{border-color:var(--yellow);background:rgba(255,209,102,.1);color:var(--yellow)}
.btn{padding:11px 16px;background:var(--accent);color:#000;border:none;border-radius:var(--radius-sm);font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.block{width:100%;margin-top:12px}
.btn.ghost{background:transparent;color:var(--text-mid);border:1px solid var(--border)}
.btn.ghost:hover{color:var(--text);border-color:var(--text-mid)}
.btn.sm{padding:6px 12px;font-size:12px}
.icon-btn{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:14px;padding:2px 5px;border-radius:4px}
.icon-btn:hover{color:var(--accent)} .icon-btn.del:hover{color:var(--red)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters select,.filters input[type=text]{width:auto;flex:1 1 150px;padding:8px 10px;font-size:12.5px}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-mid);cursor:pointer;white-space:nowrap}
.chk input{width:auto}
.count{font-size:12px;color:var(--text-mid);margin-bottom:10px}
.empty{text-align:center;padding:30px;color:var(--text-dim);font-size:13px}
details.method{margin-top:6px}
details.method summary{cursor:pointer;font-size:12px;color:var(--text-mid);font-weight:600;padding:6px 0}
details.method ul{margin:8px 0 0 18px;font-size:12px;color:var(--text-mid);line-height:1.6}
details.method b{color:var(--text)}
canvas{max-width:100%}

/* Waterfall */
.wf td{padding:8px 10px}
.wf tr.total td{font-weight:700;border-top:2px solid var(--border)}
.wf .ex{font-size:10.5px;color:var(--text-dim);display:block;margin-top:2px}

/* Toast & modal */
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface2);border:1px solid var(--accent);color:var(--accent);padding:12px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;z-index:2000;transform:translateY(80px);opacity:0;transition:all .25s;pointer-events:none;max-width:90vw}
.toast.show{transform:translateY(0);opacity:1}.toast.error{border-color:var(--red);color:var(--red)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:520px;max-height:82vh;display:flex;flex-direction:column}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal-title{font-size:14px;font-weight:700}
.modal-body{padding:10px 18px 18px;overflow-y:auto}

@media (max-width:680px){
  .app{padding:14px 12px 60px}
  .header{flex-direction:column;align-items:stretch}
  .month-nav{justify-content:space-between}
  .tab{font-size:12px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .disp-grid{grid-template-columns:repeat(2,1fr)}
  .sobre{grid-template-columns:1fr auto;gap:6px 10px}
  .sobre .track{grid-column:1/-1;order:3}
  .sobre .s-val{order:2;grid-column:1/2;text-align:left}
  .sobre .s-st{order:1;grid-column:2/3;grid-row:1/2;text-align:right}
  .cat-row{grid-template-columns:1fr auto;gap:4px 10px}
  .cat-row .cat-track{grid-column:1/-1;order:3}
  .cat-row .cat-delta{grid-column:1/-1;text-align:left;order:4}
  .form-grid{grid-template-columns:1fr}
  input,select{font-size:16px}
  .hero h2{font-size:17px}
  .big-num{font-size:22px}
}
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div>
      <h1>Finanzas <span>JC</span></h1>
      <p id="header-sub">Cargando&hellip;</p>
    </div>
    <div class="month-nav">
      <button onclick="changeMonth(-1)" aria-label="Mes anterior">&#8249;</button>
      <span id="mes-label"></span>
      <button onclick="changeMonth(1)" aria-label="Mes siguiente">&#8250;</button>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="registrar" onclick="switchTab('registrar')">&#10010; Registrar</button>
    <button class="tab" data-tab="mes" onclick="switchTab('mes')">&#9678; Mi mes</button>
    <button class="tab" data-tab="historial" onclick="switchTab('historial')">&#8801; Historial</button>
    <button class="tab" data-tab="patrimonio" onclick="switchTab('patrimonio')">&#9878; Patrimonio</button>
  </div>

  <!-- ================= REGISTRAR ================= -->
  <div id="tab-registrar" class="panel active">
    <div class="card">
      <div class="card-head"><div class="card-title" id="form-title">Nuevo gasto</div></div>
      <div class="form-grid">
        <div class="fg"><label>Monto (S/)</label><input type="number" id="inp-monto" placeholder="0.00" step="0.01" min="0" inputmode="decimal"></div>
        <div class="fg"><label>Fecha</label><input type="date" id="inp-fecha"></div>
        <div class="fg"><label>Tipo</label>
          <div class="seg">
            <button type="button" class="seg-btn tipo-btn active" id="tipo-gasto" onclick="setTipo('gasto')">&#x1F4B8; Gasto</button>
            <button type="button" class="seg-btn tipo-btn" id="tipo-ingreso" onclick="setTipo('ingreso')">&#x1F4B0; Ingreso</button>
          </div>
        </div>
        <div class="fg"><label>Categor&iacute;a</label><select id="inp-categoria"></select></div>
        <div class="fg full"><label>Medio de pago</label>
          <div class="seg" id="medios"></div>
        </div>
        <div class="fg full"><label>Descripci&oacute;n <span class="dim" style="text-transform:none;font-weight:400">(opcional)</span></label>
          <input type="text" id="inp-desc" placeholder="ej. almuerzo con Mariana, Uber al aeropuerto&hellip;"></div>
      </div>
      <button class="btn block" id="btn-guardar" onclick="guardarGasto()">Guardar gasto</button>
      <button class="btn ghost block" id="btn-cancelar" style="display:none;margin-top:8px" onclick="cancelarEdicion()">Cancelar edici&oacute;n</button>
    </div>
    <div class="card">
      <div class="card-head"><div class="card-title" id="dia-title">Movimientos del d&iacute;a</div></div>
      <div id="lista-dia"></div>
    </div>
  </div>

  <!-- ================= MI MES ================= -->
  <div id="tab-mes" class="panel">
    <div id="mes-hero" class="hero"></div>
    <div class="kpis" id="mes-kpis"></div>
    <div id="mes-alertas"></div>
    <div class="card" id="mes-disponible"></div>
    <div class="card" id="mes-presupuesto"></div>
    <div class="card" id="mes-categorias"></div>
    <div class="card">
      <div class="card-head">
        <div><div class="card-title">&iquest;Estoy ahorrando m&aacute;s que antes?</div>
        <div class="card-sub" id="tend-sub">&Uacute;ltimos 6 meses</div></div>
      </div>
      <canvas id="chart-tend" height="110"></canvas>
      <div class="table-wrap" style="margin-top:12px" id="tend-tabla"></div>
    </div>
    <div class="card">
      <details class="method">
        <summary>C&oacute;mo se calcula cada n&uacute;mero</summary>
        <ul id="metodo"></ul>
      </details>
    </div>
  </div>

  <!-- ================= HISTORIAL ================= -->
  <div id="tab-historial" class="panel">
    <div class="filters">
      <select id="f-cat"></select>
      <select id="f-medio">
        <option value="">Todos los medios</option>
        <option>Yape</option><option>TC Apple Pay</option><option>Transferencia</option>
        <option value="__null__">Sin especificar</option>
      </select>
      <select id="f-tipo">
        <option value="">Gastos e ingresos</option>
        <option value="gasto">Solo gastos</option>
        <option value="ingreso">Solo ingresos</option>
      </select>
      <input type="text" id="f-texto" placeholder="Buscar descripci&oacute;n&hellip;">
      <label class="chk"><input type="checkbox" id="f-todos"> Todos los meses</label>
      <label class="chk"><input type="checkbox" id="f-dup"> Posibles duplicados</label>
    </div>
    <div class="count" id="hist-count"></div>
    <div class="card" style="padding:6px 8px">
      <div class="table-wrap"><table>
        <thead><tr><th>Fecha</th><th>Descripci&oacute;n</th><th>Categor&iacute;a</th><th>Medio</th><th class="r">Monto</th><th></th></tr></thead>
        <tbody id="hist-body"></tbody>
      </table></div>
    </div>
  </div>

  <!-- ================= PATRIMONIO ================= -->
  <div id="tab-patrimonio" class="panel">
    <div id="pat-root"></div>
  </div>

</div>

<div class="toast" id="toast"></div>
<div class="modal" id="modal" onclick="if(event.target===this)cerrarModal()">
  <div class="modal-box" role="dialog" aria-modal="true">
    <div class="modal-head"><div class="modal-title" id="modal-title"></div>
      <button class="icon-btn del" onclick="cerrarModal()" aria-label="Cerrar">&#10005;</button></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
// ================================================================
//  FINANZAS JC
//  Objetivo: organizar las finanzas personales y fomentar el ahorro.
//  Pestanas: Registrar · Mi mes · Historial · Patrimonio
// ================================================================

// ---- Supabase ---------------------------------------------------
const SUPABASE_URL = 'https://sjmtqqkuwctruzndpqbk.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNqbXRxcWt1d2N0cnV6bmRwcWJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNzY1NDMsImV4cCI6MjA5NjY1MjU0M30.mKI-KI_hW5JjZS1coeLKORDp3rdffI2X8vT-uLwL8og';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const EMAIL_DUENO = 'jcbenitesluna@gmail.com';

// ---- Catalogos --------------------------------------------------
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MESES_CORTO = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const CATS_GASTO = ['Comida en casa','Restaurantes','Transporte','Gasolina','Farmacia','Deporte','Ocio','Ropa',
                    'Suscripciones','Otros','Luz','Mantenimiento','Depa alquiler','Pago terreno','Pichincha'];
const CATS_INGRESO = ['Salario BAP','Ingreso Juntta','Ingreso Extraordinario'];
const MEDIOS = ['Yape','TC Apple Pay','Transferencia'];
const MEDIO_TRANSFERENCIA = ['Depa alquiler','Pago terreno'];

// Sobres: TODA categoria de gasto pertenece a un sobre (cobertura 100%).
//   fijo     = compromiso contractual (no se proyecta linealmente)
//   terreno  = cuota que construye patrimonio iliquido (sale de caja, no es consumo)
//   variable = gasto que depende de decisiones del mes
const SOBRES_BASE = [
  { id:'vivienda',  nombre:'Alquiler depa',        tipo:'fijo',     budget:1350, color:'#74b9ff', cats:['Depa alquiler'] },
  { id:'servicios', nombre:'Luz y mantenimiento',  tipo:'fijo',     budget:350,  color:'#0984e3', cats:['Luz','Mantenimiento'] },
  { id:'terreno',   nombre:'Cuota terreno',        tipo:'terreno',  budget:1240, color:'#a29bfe', cats:['Pago terreno'] },
  { id:'comida',    nombre:'Comida',               tipo:'variable', budget:900,  color:'#00d9a6', cats:['Comida en casa','Restaurantes'] },
  { id:'movilidad', nombre:'Movilidad',            tipo:'variable', budget:330,  color:'#ffd166', cats:['Gasolina','Transporte'] },
  { id:'deporte',   nombre:'Deporte',              tipo:'variable', budget:120,  color:'#55efc4', cats:['Deporte'] },

}

function tipoCat(cat) { return sobre(sobreId(cat)).tipo; }

// ---- Helpers ----------------------------------------------------
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function ymd(y, m, d) { return y + '-' + pad2(m + 1) + '-' + pad2(d); }
function ultimoDia(y, m) { return new Date(y, m + 1, 0).getDate(); }
function hoyISO() { var d = new Date(); return ymd(d.getFullYear(), d.getMonth(), d.getDate()); }
function ymOf(f) { return String(f || '').slice(0, 7); }
function mesYM() { return cy + '-' + pad2(cm + 1); }
function ymShift(ym, k) { var y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1 + k; while (m < 0) { m += 12; y--; } while (m > 11) { m -= 12; y++; } return y + '-' + pad2(m + 1); }
function nombreMes(ym) { return MESES[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4); }
function mesCorto(ym) { return MESES_CORTO[+ym.slice(5, 7) - 1] + ' ' + ym.slice(2, 4); }
function r2(x) { return Math.round((Number(x) || 0) * 100) / 100; }
function fmt(n) { return Number(n || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function fmt0(n) { return Math.round(Number(n || 0)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function S(n) { return 'S/ ' + fmt(n); }
function S0(n) { return (n < 0 ? '-' : '') + 'S/ ' + fmt0(Math.abs(n)); }
function Ss(n) { return (n < 0 ? '-' : '') + 'S/ ' + fmt(Math.abs(n)); }
function Sp(n) { return (n > 0 ? '+' : n < 0 ? '-' : '') + 'S/ ' + fmt(Math.abs(n)); }
function pct(x, d) { return x == null || !isFinite(x) ? '—' : (x * 100).toFixed(d == null ? 0 : d) + '%'; }
function fFecha(s) { var p = String(s || '').split('-'); return p[2] + '/' + p[1] + '/' + (p[0] || '').slice(2); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function el(id) { return document.getElementById(id); }
function html(id, v) { var e = el(id); if (e) e.innerHTML = v; }
function sumar(arr) { return r2(arr.reduce(function (s, g) { return s + (Number(g.monto) || 0); }, 0)); }
function hexA(hex, a) { var n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; }
function colorCat(cat) { return sobre(sobreId(cat)).color; }
function esIngreso(g) { return g.tipo === 'ingreso'; }

// ================================================================
//  CARGA DE DATOS
// ================================================================
// PostgREST devuelve maximo 1000 filas por consulta: se pagina hasta traer todo.
async function traerTodo(tabla, ordenar) {
  var out = [], paso = 1000, desde = 0;
  while (true) {
    var q = ordenar(db.from(tabla).select('*')).range(desde, desde + paso - 1);
    var res = await q;
    if (res.error) throw res.error;
    out = out.concat(res.data || []);
    if (!res.data || res.data.length < paso) break;
    desde += paso;
  }
  return out;
}

async function cargarGastos() {
  try {
    var data = await traerTodo('gastos', function (q) { return q.order('fecha', { ascending: false }).order('id', { ascending: true }); });
    allGastos = data.map(function (g) { g.monto = Number(g.monto) || 0; g.fecha = String(g.fecha || '').slice(0, 10); return g; });
    marcarDuplicados();
    render();
  } catch (e) { console.error(e); showToast('Error al cargar movimientos', true); }
}

async function cargarConfig() {
  var res = await db.from('app_config').select('*');
  if (res.error) { console.warn('config', res.error); return; }
  (res.data || []).forEach(function (r) {
    if (r.clave === 'meta_ahorro' && Number(r.valor) > 0 && Number(r.valor) < 1) CFG.meta = Number(r.valor);
    if (r.clave === 'presupuesto' && r.valor && typeof r.valor === 'object') CFG.presupuesto = r.valor;
    if (r.clave === 'terreno' && r.valor) CFG.terreno = Object.assign({}, CFG.terreno, r.valor);
  });
}
async function guardarConfig(clave, valor) {
  return db.from('app_config').upsert({ clave: clave, valor: valor, updated_at: new Date().toISOString() });
}

// Mismo dia + monto + categoria + medio + tipo => posible duplicado
function marcarDuplicados() {
  var grupos = {};
  allGastos.forEach(function (g) {
    var k = [g.fecha, g.monto.toFixed(2), g.categoria, g.medio_pago || '', g.tipo].join('|');
    (grupos[k] = grupos[k] || []).push(g);
  });
  dupIds = new Set();
  Object.keys(grupos).forEach(function (k) { if (grupos[k].length > 1) grupos[k].forEach(function (g) { dupIds.add(String(g.id)); }); });
}

// ================================================================
//  CALCULOS DEL MES (una sola fuente de verdad)
// ================================================================
function regsMes(ym) { return allGastos.filter(function (g) { return ymOf(g.fecha) === ym; }); }

// Definiciones:
//   ingresos       = movimientos tipo ingreso, en el mes en que entra el dinero
//   egresos        = todo lo que sale de caja (incluye cuota del terreno)
//   ahorro liquido = ingresos - egresos           -> lo que queda en caja
//   ahorro total   = ahorro liquido + cuota terreno -> incluye patrimonio iliquido
function resumenMes(ym) {
  var r = { ym: ym, ing: 0, egr: 0, ter: 0, fij: 0, vari: 0, n: 0, porSobre: {}, porCat: {} };
  regsMes(ym).forEach(function (g) {
    r.n++;
    if (esIngreso(g)) { r.ing += g.monto; return; }
    r.egr += g.monto;
    var sid = sobreId(g.categoria), t = sobre(sid).tipo;
    r.porSobre[sid] = (r.porSobre[sid] || 0) + g.monto;
    if (t === 'terreno') r.ter += g.monto; else if (t === 'fijo') r.fij += g.monto;
    else { r.vari += g.monto; r.porCat[g.categoria] = (r.porCat[g.categoria] || 0) + g.monto; }
  });
  ['ing','egr','ter','fij','vari'].forEach(function (k) { r[k] = r2(r[k]); });
  r.consumo = r2(r.egr - r.ter);
  r.ahorroLiq = r2(r.ing - r.egr);
  r.ahorroTot = r2(r.ahorroLiq + r.ter);
  r.tasaLiq = r.ing > 0 ? r.ahorroLiq / r.ing : null;
  r.tasaTot = r.ing > 0 ? r.ahorroTot / r.ing : null;
  r.metaMonto = r2(r.ing * CFG.meta);
  return r;
}

function estadoMes(ym) { var h = ymOf(hoyISO()); return ym < h ? 'cerrado' : (ym > h ? 'futuro' : 'encurso'); }

// Proyeccion: SOLO el gasto variable se extrapola al ritmo diario.
// Fijos (alquiler, luz, mantenimiento) y cuota del terreno entran por su monto
// esperado = max(lo ya pagado, lo presupuestado).
function proyeccion(ym) {
  var R = resumenMes(ym), est = estadoMes(ym);
  var y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1, dm = ultimoDia(y, m), hoy = hoyISO();
  var dia = est === 'encurso' ? +hoy.slice(8, 10) : (est === 'cerrado' ? dm : 0);
  var varHoy = 0, varFut = 0;
  regsMes(ym).forEach(function (g) {
    if (esIngreso(g) || tipoCat(g.categoria) !== 'variable') return;
    if (g.fecha <= hoy) varHoy += g.monto; else varFut += g.monto;
  });
  varHoy = r2(varHoy); varFut = r2(varFut);
  var fijosEsp = 0, fijosPend = 0;
  SOBRES.forEach(function (s) {
    if (s.tipo === 'variable') return;
    var real = R.porSobre[s.id] || 0;
    fijosEsp += est === 'cerrado' ? real : Math.max(real, s.budget);
    fijosPend += est === 'cerrado' ? 0 : Math.max(s.budget - real, 0);
  });
  var ritmo = dia > 0 ? varHoy / dia : 0;
  var proyVar = est === 'encurso' ? ritmo * dm + varFut : varHoy + varFut;
  return { R: R, est: est, dia: dia, dm: dm, varHoy: varHoy, varFut: varFut, ritmo: ritmo,
           proyVar: r2(proyVar), fijosEsp: r2(fijosEsp), fijosPend: r2(fijosPend),
           proyEgr: r2(fijosEsp + proyVar), ahorroProy: r2(R.ing - fijosEsp - proyVar) };
}

function mesesConDatos() {
  var s = {}; allGastos.forEach(function (g) { var k = ymOf(g.fecha); if (k) s[k] = 1; });
  return Object.keys(s).sort();
}

function renderMes() {
  var ym = mesYM(), P = proyeccion(ym), R = P.R, est = P.est, meta = CFG.meta;
  var nom = MESES[cm];

  // ---- 1. Titular: ahorro vs meta ----
  var hero = el('mes-hero'), h2 = '', p = '', cls = '', barra = '';
  if (R.ing <= 0) {
    cls = 'mid';
    h2 = est === 'futuro' ? nom + ' a&uacute;n no empieza' : 'A&uacute;n no registras ingresos en ' + nom;

        (R.egr > 0 ? 'Egresos registrados: ' + S(R.egr) + '.' : '');
  } else {
    var tasa = est === 'encurso' ? P.ahorroProy / R.ing : R.tasaLiq;
    var monto = est === 'encurso' ? P.ahorroProy : R.ahorroLiq;

      h2 = 'Al ritmo actual cerrar&aacute;s ' + nom + ' ahorrando <b class="' + (monto >= 0 ? 'pos' : 'neg') + '">' + Ss(monto) + '</b> (' + pct(tasa) + ')';
      p = (gap <= 0 ? '&#10003; Por encima de tu meta del ' + pct(meta) + ' (' + S(R.metaMonto) + ').'
                    : 'Te faltar&iacute;an <b>' + S(gap) + '</b> para tu meta del ' + pct(meta) + ' (' + S(R.metaMonto) + ').') +
          ' Hoy llevas ' + Ss(R.ahorroLiq) + ' en caja. La proyecci&oacute;n asume fijos completos y gasto variable a ' + S(P.ritmo) + '/d&iacute;a.';
    } else if (est === 'cerrado') {
      h2 = 'En ' + nom + ' ahorraste <b class="' + (monto >= 0 ? 'pos' : 'neg') + '">' + Ss(monto) + '</b> (' + pct(tasa) + ' de tus ingresos)';
      p = gap <= 0 ? '&#10003; Cumpliste tu meta del ' + pct(meta) + ' con ' + S(-gap) + ' de margen.'
                   : 'Quedaste <b>' + S(gap) + '</b> por debajo de tu meta del ' + pct(meta) + ' (' + S(R.metaMonto) + ').';
    } else {
      h2 = nom + ': ' + Ss(monto) + ' de ahorro con lo registrado por adelantado';
      p = 'Mes futuro: solo incluye movimientos con fecha adelantada.';
    }

    barra = '<div class="meta-track"><div class="meta-fill" style="width:' + w + '%;background:' + (tasa >= meta ? 'var(--accent)' : (tasa >= 0 ? 'var(--yellow)' : 'var(--red)')) + '"></div>' +
            '<div class="meta-mark" style="left:' + mk + '%"></div></div>' +
            '<div class="meta-legend"><span>Tasa de ahorro ' + (est === 'encurso' ? 'proyectada' : '') + ': ' + pct(tasa) + '</span><span>Meta ' + pct(meta) + '</span></div>';
  }
  hero.className = 'hero ' + cls;
  hero.innerHTML = '<h2>' + h2 + '</h2><p>' + p + '</p>' + barra;

  // ---- 2. KPIs ----
  html('mes-kpis',
    kpi('Ingresos', S(R.ing), 'var(--yellow)', nIngresos(ym) + ' ingreso(s) &middot; ver detalle', "verMovs('ingresos')") +
    kpi('Egresos', S(R.egr), null, 'Consumo ' + S0(R.consumo) + ' + cuota terreno ' + S0(R.ter), "verMovs('egresos')") +
    kpi('Ahorro l&iacute;quido', Ss(R.ahorroLiq), R.ahorroLiq >= 0 ? 'var(--accent)' : 'var(--red)',

    kpi('Ahorro total', Ss(R.ahorroTot), 'var(--purple)',
        (R.tasaTot == null ? '' : pct(R.tasaTot) + ' &middot; ') + 'incluye ' + S0(R.ter) + ' en terreno (il&iacute;quido)'));

  // ---- 3. Alertas ----

    ? '<div class="note warn" style="margin:0 0 14px">&#9888; ' + dups.length + ' movimientos de ' + nom + ' parecen duplicados (mismo d&iacute;a, monto, categor&iacute;a y medio). ' +

    '<li><b>Proyecci&oacute;n</b>: alquiler, luz, mantenimiento y terreno entran por su monto esperado (lo pagado o lo presupuestado, el mayor). Solo el gasto variable se extrapola: gasto variable hasta hoy &divide; d&iacute;as transcurridos &times; d&iacute;as del mes.</li>' +
    '<li><b>Presupuesto</b>: cada categor&iacute;a pertenece a un sobre, as&iacute; el % utilizado compara el gasto total contra un presupuesto que cubre el 100% del gasto. Las categor&iacute;as nuevas caen en &laquo;Gustos y otros&raquo;.</li>' +
    '<li><b>Ritmo</b> (l&iacute;nea vertical en las barras variables): % del mes transcurrido. Si la barra la pasa por m&aacute;s de 10 pp, vas r&aacute;pido.</li>' +
    '<li><b>Comparaci&oacute;n por categor&iacute;a</b>: contra el promedio de los 3 meses anteriores con datos; en el mes en curso, ese promedio se prorratea a los d&iacute;as transcurridos.</li>');
}
function kpi(l, v, color, sub, onclick) {

         '<div class="kpi-l">' + l + '</div><div class="kpi-v"' + (color ? ' style="color:' + color + '"' : '') + '>' + v + '</div>' +
         (sub ? '<div class="kpi-s">' + sub + '</div>' : '') + '</div>';
}
function nIngresos(ym) { return regsMes(ym).filter(esIngreso).length; }

function renderDisponible(P) {
  var box = el('mes-disponible'), R = P.R;
  if (P.est !== 'encurso' || R.ing <= 0) { box.style.display = 'none'; return; }
  box.style.display = '';
  var tope = r2(R.ing * (1 - CFG.meta));
  var disp = r2(tope - R.egr - P.fijosPend);
  var diasRest = P.dm - P.dia + 1;
  var porDia = disp / diasRest;
  var titulo = disp >= 0
    ? 'Puedes gastar <span class="pos">' + S(disp) + '</span> m&aacute;s en variables este mes'
    : 'Ya est&aacute;s <span class="neg">' + S(-disp) + '</span> por encima del tope para cumplir la meta';
  var sub = disp >= 0
    ? 'Equivale a <b>' + S(porDia) + ' por d&iacute;a</b> en los ' + diasRest + ' d&iacute;as que quedan (incluido hoy). Hoy vas a ' + S(P.ritmo) + '/d&iacute;a en gasto variable' +
      (P.ritmo > porDia ? ' &rarr; <span class="warn">baja el ritmo</span>.' : ' &rarr; <span class="pos">vas bien</span>.')
    : 'Cada sol adicional que gastes este mes sale de tu ahorro. Para recuperar la meta tendr&iacute;as que sumar ingresos o recortar fijos.';
  box.innerHTML = '<div class="card-title">' + titulo + '</div><div class="card-sub">' + sub + '</div>' +
    '<div class="disp-grid">' +
      cell('Tope de egresos', S(tope), 'ingresos &times; ' + pct(1 - CFG.meta)) +
      cell('Ya egresado', S(R.egr), '') +
      cell('Fijos por pagar', S(P.fijosPend), 'seg&uacute;n presupuesto') +
      cell('Disponible', '<span class="' + (disp >= 0 ? 'pos' : 'neg') + '">' + Ss(disp) + '</span>', '') +
    '</div>';
  function cell(l, v, s) { return '<div class="disp-cell"><div class="l">' + l + '</div><div class="v">' + v + '</div>' + (s ? '<div class="kpi-s">' + s + '</div>' : '') + '</div>'; }
}

function filaSobre(s, real, est, ritmo) {

    else if (real > b * 1.05) { st = 'Sobre presup.'; cls = 'over'; }

    '<div class="s-val">' + val + '</div>' +

// ================================================================
//  PATRIMONIO
// ================================================================
const CLASES = {
  liquido:   { t: 'Cuentas y efectivo',            signo: 1,  grupo: 'liq' },
  tarjeta:   { t: 'Tarjetas de crédito (deuda)', signo: -1, grupo: 'liq' },
  inversion: { t: 'Inversiones (bolsa, fondos)',   signo: 1,  grupo: 'inv' },
  iliquido:  { t: 'Bienes ilíquidos (terreno, auto…)', signo: 1, grupo: 'ili' },
  deuda:     { t: 'Deudas de largo plazo',         signo: -1, grupo: 'deu' }
};
const ORDEN_CLASES = ['liquido','tarjeta','inversion','iliquido','deuda'];

async function initAuth() {
  var r = await db.auth.getSession(); session = r.data.session;
  db.auth.onAuthStateChange(function (_e, s) {

  });
}
async function login(crear) {
  var email = el('au-email').value.trim(), pw = el('au-pw').value;
  if (!email || pw.length < 8) return showToast('Correo y contraseña de 8+ caracteres', true);

                  : await db.auth.signInWithPassword({ email: email, password: pw });

async function cargarPatrimonio() {
  if (!session) return;
  try {
    var a = await db.from('pat_cuentas').select('*').order('orden').order('created_at');
    var b = await traerTodo('pat_saldos', function (q) { return q.order('mes'); });
    var c = await db.from('pat_tc').select('*').order('mes');
    if (a.error) throw a.error; if (c.error) throw c.error;
    PAT.cuentas = a.data || []; PAT.saldos = b.map(function (s) { s.saldo = Number(s.saldo); s.aporte = Number(s.aporte || 0); return s; });
    PAT.tc = (c.data || []).map(function (t) { t.usd_pen = Number(t.usd_pen); return t; });
    PAT.cargado = true; PAT.error = null;
  } catch (e) { console.error(e); PAT.error = e.message || String(e); }

function tcDe(ym) {
  var t = PAT.tc.filter(function (x) { return x.mes <= ym; }).sort(function (a, b) { return a.mes < b.mes ? 1 : -1; })[0];
  return t ? { v: t.usd_pen, mes: t.mes, exacto: t.mes === ym } : null;
}
// Saldo pendiente del terreno: se deriva de las cuotas registradas en la app.
// Referencia: cuota #ref_cuota pagada en ref_mes.
function saldoTerreno(ym) {
  var T = CFG.terreno, s = (T.total_cuotas - T.ref_cuota) * T.cuota;
  allGastos.forEach(function (g) {
    if (g.categoria !== 'Pago terreno' || esIngreso(g)) return;
    var k = ymOf(g.fecha);
    if (k > T.ref_mes && k <= ym) s -= g.monto;
    else if (k <= T.ref_mes && k > ym) s += g.monto;
  });
  return Math.max(0, r2(s));
}
function saldoCuenta(c, ym) {
  if (c.auto === 'terreno_saldo') return { v: saldoTerreno(ym), mes: ym, exacto: true, aporte: 0, auto: true };
  var s = PAT.saldos.filter(function (x) { return x.cuenta_id === c.id && x.mes <= ym; }).sort(function (a, b) { return a.mes < b.mes ? 1 : -1; })[0];
  return s ? { v: s.saldo, mes: s.mes, exacto: s.mes === ym, aporte: s.mes === ym ? s.aporte : 0 } : null;
}
function aPEN(c, v, tc) { return c.moneda === 'USD' ? (tc ? v * tc : null) : v; }

function snapshot(ym) {
  var tc = tcDe(ym), tcv = tc ? tc.v : null;
  var out = { ym: ym, tc: tc, filas: [], liq: 0, inv: 0, ili: 0, deu: 0, deuTerreno: 0, sinTC: [], viejas: [], vacias: [], hay: false };
  PAT.cuentas.forEach(function (c) {
    var s = saldoCuenta(c, ym);
    if (!s) { out.vacias.push(c); out.filas.push({ c: c, s: null, pen: null }); return; }
    if (!s.auto) out.hay = true;
    var pen = aPEN(c, s.v, tcv);
    if (pen == null) { out.sinTC.push(c.nombre); out.filas.push({ c: c, s: s, pen: null }); return; }
    if (!s.exacto) out.viejas.push(c.nombre);
    var cl = CLASES[c.clase], val = cl.signo * pen;
    if (cl.grupo === 'liq') out.liq += val; else if (cl.grupo === 'inv') out.inv += val;
    else if (cl.grupo === 'ili') out.ili += val; else { out.deu += pen; if (c.auto === 'terreno_saldo') out.deuTerreno += pen; }
    out.filas.push({ c: c, s: s, pen: pen });
  });
  out.nw = r2(out.liq + out.inv + out.ili - out.deu);
  out.iliNeto = r2(out.ili - out.deuTerreno);
  out.otrasDeudas = r2(out.deu - out.deuTerreno);
  return out;
}

// Cuadre: puente entre el patrimonio del mes anterior y el actual.
//   dLiq = (ahorro total - cuota terreno - aportes a inversion) + efecto TC + DESCUADRE
//   dInv = aportes + RENDIMIENTO + efecto TC
//   dIli = REVALUACION + efecto TC
//   -dDeu = cuota terreno + OTRAS AMORTIZACIONES + efecto TC
// => dNW = ahorro total + rendimiento + revaluacion + efecto TC + otras amortizaciones + cuentas nuevas + descuadre
function cuadre(ym) {
  var pym = ymShift(ym, -1), tcA = tcDe(ym), tcB = tcDe(pym);
  var A = snapshot(ym), B = snapshot(pym);
  if (!B.hay || !A.hay) return null;
  var R = resumenMes(ym);
  var d = { liq: 0, inv: 0, ili: 0, deu: 0 }, fx = { liq: 0, inv: 0, ili: 0, deu: 0 }, ap = 0, nuevas = 0, faltan = [];
  PAT.cuentas.forEach(function (c) {
    var sa = saldoCuenta(c, ym), sb = saldoCuenta(c, pym), cl = CLASES[c.clase];
    if (!sa) return;
    var usd = c.moneda === 'USD';
    if (usd && !tcA) { faltan.push(c.nombre); return; }       // tampoco entra en el patrimonio actual
    var pa = usd ? sa.v * tcA.v : sa.v;
    if (!sb || (usd && !tcB)) { nuevas += cl.signo * pa; return; } // no estaba valorizada el mes anterior
    var pb = usd ? sb.v * tcB.v : sb.v;
    var delta = cl.signo * (pa - pb);                       // contribucion al patrimonio
    var efx = usd ? cl.signo * sb.v * (tcA.v - tcB.v) : 0;  // revalorizacion por tipo de cambio
    d[cl.grupo] += delta; fx[cl.grupo] += efx;
    if (c.clase === 'inversion' && sa.exacto) ap += usd ? sa.aporte * tcA.v : sa.aporte;
  });
  var Sav = R.ahorroTot, T = R.ter;
  var r = {
    ym: ym, pym: pym, A: A, B: B, R: R, faltan: faltan,
    ahorro: Sav, cuota: T, aportes: r2(ap),
    rend: r2(d.inv - fx.inv - ap),
    reval: r2(d.ili - fx.ili),
    otrasDeu: r2(d.deu - fx.deu - T),
    fx: r2(fx.liq + fx.inv + fx.ili + fx.deu),
    nuevas: r2(nuevas),
    desc: r2(d.liq - fx.liq - (Sav - T - ap))
  };
  r.suma = r2(B.nw + r.ahorro + r.rend + r.reval + r.fx + r.otrasDeu + r.nuevas + r.desc);
  r.cierra = Math.abs(r.suma - A.nw) < 0.05;
  r.tol = Math.max(50, R.ing * 0.01);
  return r;
}

function renderCuadre(ym) {
  var C = cuadre(ym);
  var h = '<div class="card"><div class="card-head"><div><div class="card-title">Cuadre de ' + nombreMes(ym) + '</div>' +
          '<div class="card-sub">Explica la variaci&oacute;n del patrimonio con lo que registraste en la app. Lo que no se explica es el <b>descuadre</b>.</div></div></div>';
  if (!C) return h + '<div class="empty">Necesitas saldos al cierre de ' + mesCorto(ymShift(ym, -1)) + ' y de ' + mesCorto(ym) + ' para cuadrar.</div></div>';
  var ok = Math.abs(C.desc) <= C.tol;
  var lineas = [
    ['Patrimonio al cierre de ' + nombreMes(C.pym), C.B.nw, '', 'base'],
    ['+ Ahorro del mes', C.ahorro, 'Ingresos ' + S0(C.R.ing) + ' &minus; consumo ' + S0(C.R.consumo) + '. Incluye ' + S0(C.cuota) + ' de cuota que pas&oacute; de caja a terreno.'],
    ['+ Rendimiento de inversiones', C.rend, 'Variaci&oacute;n de inversiones &minus; aportes (' + S0(C.aportes) + ') &minus; efecto TC.'],
    ['+ Revaluaci&oacute;n de bienes il&iacute;quidos', C.reval, 'Cambio en el valor que registraste del terreno u otros bienes.'],
    ['+ Efecto tipo de cambio', C.fx, 'Saldos en d&oacute;lares del mes anterior &times; variaci&oacute;n del TC.'],
    ['+ Otras deudas amortizadas', C.otrasDeu, 'Reducci&oacute;n de deudas distinta a la cuota del terreno.'],
    ['+ Cuentas incorporadas', C.nuevas, 'Cuentas que aparecen por primera vez este mes.'],
    ['&plusmn; Descuadre de caja', C.desc, ok ? 'Dentro de la tolerancia (' + S0(C.tol) + ').' :
      (C.desc < 0 ? 'Falta dinero en tus cuentas vs. lo registrado: gastos no registrados o ingresos sobreestimados.'
                  : 'Sobra dinero vs. lo registrado: ingresos no registrados o gastos duplicados.')]
  ];
  h += '<div class="note ' + (ok ? '' : 'warn') + '" style="margin:0 0 10px">' + (ok ? '&#10003; Caja cuadrada: lo que registras explica tus saldos.' :
       '&#9888; Descuadre de ' + Ss(C.desc) + ' en ' + nombreMes(ym) + '.') + '</div>';
  h += '<table class="wf"><tbody>';
  lineas.forEach(function (l) {
    if (l[3] !== 'base' && Math.abs(l[1]) < 0.005 && l[0].indexOf('Descuadre') === -1 && l[0].indexOf('Ahorro') === -1) return;
    var c = l[3] === 'base' ? '' : (l[1] > 0 ? 'pos' : (l[1] < 0 ? 'neg' : 'dim'));
    h += '<tr><td>' + l[0] + (l[2] ? '<span class="ex">' + l[2] + '</span>' : '') + '</td><td class="num ' + c + '">' + (l[3] === 'base' ? Ss(l[1]) : Sp(l[1])) + '</td></tr>';
  });
  h += '<tr class="total"><td>= Patrimonio al cierre de ' + nombreMes(ym) + '</td><td class="num">' + Ss(C.A.nw) + '</td></tr></tbody></table>';
  if (!C.cierra) h += '<div class="note bad">Control interno: la suma del puente (' + Ss(C.suma) + ') no coincide con el patrimonio (' + Ss(C.A.nw) + ').</div>';
  if (C.faltan.length) h += '<div class="note warn">Sin tipo de cambio para cuadrar: ' + C.faltan.map(esc).join(', ') + '.</div>';
  if (C.A.viejas.length || C.B.viejas.length) h += '<div class="note warn">Hay cuentas con saldo arrastrado de meses anteriores: el descuadre puede deberse a eso.</div>';
  return h + '</div>';
}

function formSaldos(ym, A) {

  });
  h += '</tbody></table><button class="btn block" onclick="guardarSaldos()">Guardar saldos de ' + mesCorto(ym) + '</button></div>';
  return h;

async function traerTC() {
  try {
    var r = await fetch('https://open.er-api.com/v6/latest/USD'), j = await r.json();
    var v = j && j.rates && j.rates.PEN;
    if (!v) throw new Error('sin dato');
    el('ps-tc').value = v.toFixed(4);
    showToast('TC ' + v.toFixed(3) + ' (open.er-api, ' + String(j.time_last_update_utc || '').slice(5, 16) + ')');
  } catch (e) { showToast('No se pudo traer el TC: ingrésalo manual', true); }
}

async function guardarSaldos() {
  var ym = mesYM(), filas = [];
  document.querySelectorAll('input[data-saldo]').forEach(function (i) {
    if (i.value === '') return;
    var id = i.dataset.saldo, ap = document.querySelector('input[data-aporte="' + id + '"]');
    filas.push({ cuenta_id: id, mes: ym, saldo: r2(i.value), aporte: ap && ap.value !== '' ? r2(ap.value) : 0, updated_at: new Date().toISOString() });
  });
  var tcIn = el('ps-tc');
  if (tcIn && tcIn.value !== '') {
    var t = await db.from('pat_tc').upsert({ mes: ym, usd_pen: Number(tcIn.value), fuente: 'manual/er-api', updated_at: new Date().toISOString() });
    if (t.error) { console.error(t.error); return showToast('Error al guardar el TC', true); }
  }
  if (filas.length) {
    var res = await db.from('pat_saldos').upsert(filas, { onConflict: 'cuenta_id,mes' });
    if (res.error) { console.error(res.error); return showToast('Error al guardar saldos', true); }
  }
  showToast(filas.length + ' saldo(s) guardado(s)');
  await cargarPatrimonio();
}
async function crearCuenta() {
  var nombre = el('nc-nombre').value.trim();
  if (!nombre) return showToast('Ponle un nombre a la cuenta', true);
  var res = await db.from('pat_cuentas').insert({ nombre: nombre, institucion: el('nc-inst').value.trim() || null, clase: el('nc-clase').value, moneda: el('nc-moneda').value, orden: 100 });
  if (res.error) { console.error(res.error); return showToast('Error al crear la cuenta', true); }
  showToast('Cuenta creada'); await cargarPatrimonio();
}
async function eliminarCuenta(id) {
  if (!confirm('¿Eliminar la cuenta y todos sus saldos históricos? Si solo la cerraste, mejor registra saldo 0.')) return;
  var res = await db.from('pat_cuentas').delete().eq('id', id);
  if (res.error) { console.error(res.error); return showToast('Error al eliminar', true); }
  await cargarPatrimonio();
}
function renderEvolucionPat(ym) {
  var meses = PAT.saldos.map(function (s) { return s.mes; }).filter(function (m, i, a) { return m <= ym && a.indexOf(m) === i; }).sort();
  if (meses.length < 2) { html('pat-evo-empty', '<div class="empty">Con dos meses de saldos ver&aacute;s la evoluci&oacute;n aqu&iacute;.</div>'); var c = el('chart-pat'); if (c) c.style.display = 'none'; return; }
  var snaps = meses.map(snapshot);
  charts.pat = nuevoChart('chart-pat', {
    type: 'line',
    data: { labels: meses.map(mesCorto), datasets: [
      { label: 'Patrimonio neto', data: snaps.map(function (s) { return s.nw; }), borderColor: '#00d9a6', backgroundColor: 'rgba(0,217,166,.12)', fill: true, tension: .25, pointRadius: 3 },
      { label: 'Líquido neto', data: snaps.map(function (s) { return s.liq; }), borderColor: '#74b9ff', fill: false, tension: .25, pointRadius: 3 },
      { label: 'Terreno neto', data: snaps.map(function (s) { return s.iliNeto; }), borderColor: '#a29bfe', borderDash: [4, 4], fill: false, tension: .25, pointRadius: 2 }
    ] },
    options: { responsive: true, aspectRatio: 2.8, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'bottom', labels: { color: '#999', font: { size: 10 }, boxWidth: 10 } }, tooltip: tooltip({ label: function (c) { return c.dataset.label + ': ' + Ss(c.parsed.y); } }) },
      scales: { x: { grid: { display: false }, ticks: { color: '#888', font: { size: 10 } } }, y: ejeSoles() } }
  });
}

// ================================================================
//  UTILIDADES UI E INICIO
// ================================================================
function showToast(msg, err) {
  var t = el('toast'); t.innerHTML = msg; t.className = 'toast show' + (err ? ' error' : '');
  clearTimeout(showToast._t); showToast._t = setTimeout(function () { t.classList.remove('show'); }, 2800);
}

window.addEventListener('DOMContentLoaded', async function () {
  aplicarConfig();
  poblarForm();
  el('inp-fecha').value = hoyISO();
  el('inp-fecha').addEventListener('change', renderDia);
  el('inp-categoria').addEventListener('change', function () {
    if (MEDIO_TRANSFERENCIA.indexOf(this.value) !== -1) selectMedio('Transferencia');
  });
  ['f-cat','f-medio','f-tipo','f-todos','f-dup'].forEach(function (id) { el(id).addEventListener('change', renderHistorial); });
  el('f-texto').addEventListener('input', renderHistorial);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') cerrarModal(); });
  if (window.Chart) Chart.defaults.animation.duration = 350;   // Chart.js ya es responsive: no se re-renderiza en resize
  html('mes-label', MESES[cm] + ' ' + cy);
  await cargarConfig();
  aplicarConfig();
  await initAuth();
  await cargarGastos();
  if (session) cargarPatrimonio();
});
</script>
